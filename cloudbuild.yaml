steps:
  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - frontend/Dockerfile
      - --build-arg
      - VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - --build-arg
      - VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg
      - VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg
      - VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}
      - --build-arg
      - VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg
      - VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - --build-arg
      - VITE_FIREBASE_MEASUREMENT_ID=${_VITE_FIREBASE_MEASUREMENT_ID}
      - --build-arg
      - VITE_FIREBASE_VAPID_KEY=${_VITE_FIREBASE_VAPID_KEY}
      - --tag
      - ${_IMAGE}
      - frontend

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_IMAGE}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --quiet

images:
  - ${_IMAGE}

substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: brainon-frontend
  _IMAGE: asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/brainon-frontend:$COMMIT_SHA
  _VITE_API_BASE_URL: https://brainon-backend-471747856095.asia-southeast1.run.app
  _VITE_FIREBASE_API_KEY: AIzaSyDKSDRTSVpDtRMoHQQeuC4yuqiNQYbvKXs
