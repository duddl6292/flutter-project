        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: patient_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: appointment_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
      x-roles:
      - CLINICIAN
      - ADMIN
    post:
      tags:
      - Clinical Records
      summary: 진료기록 등록
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ClinicalRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicalRecordCreateRequest'
      x-roles:
      - CLINICIAN
      - ADMIN
  /api/v1/clinical-records/{clinical_record_id}:
    get:
      tags:
      - Clinical Records
      summary: 진료기록 상세 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ClinicalRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: clinical_record_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - CLINICIAN
      - ADMIN
    patch:
      tags:
      - Clinical Records
      summary: 진료기록 수정
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ClinicalRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: clinical_record_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicalRecordCreateRequest'
      x-roles:
      - CLINICIAN
      - ADMIN
  /api/v1/prescriptions:
    get:
      tags:
      - Prescriptions
      summary: 처방 목록 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Prescription'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: patient
        in: query
        required: false
        schema:
          type: string
        description: '''me'' 또는 patient_id'
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
