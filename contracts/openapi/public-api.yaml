      - ADMIN
  /api/v1/notifications/{notification_id}/read:
    patch:
      tags:
      - Notifications
      summary: 알림 읽음 처리
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
