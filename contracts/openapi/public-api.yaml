          type: string
          format: uuid
  /api/v1/notifications/read-all:
    patch:
      tags:
      - Notifications
      summary: 모든 알림 읽음 처리
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: 잘못된 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 현재 상태와 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 입력값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: PATIENT_NOT_FOUND
            message:
              type: string
              example: 환자를 찾을 수 없습니다.
            details:
              type: object
              additionalProperties: true
    PaginationMeta:
      type: object
      required:
      - page
      - page_size
      - total_count
      - total_pages
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total_count:
          type: integer
          minimum: 0
          example: 58
        total_pages:
          type: integer
          minimum: 0
          example: 3
    MessageResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - message
          properties:
            message:
              type: string
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          example: patient01
        password:
          type: string
          format: password
          example: password
    RefreshTokenRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    PasswordResetRequest:
      type: object
      required:
      - username_or_email
      properties:
        username_or_email:
          type: string
          example: patient01
    UserSummary:
      type: object
      required:
      - user_id
      - role
      - name
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - PATIENT
          - CLINICIAN
          - ADMIN
        name:
          type: string
          example: 김환자
        username:
          type: string
          example: patient01
        email:
          type: string
          format: email
          nullable: true
    LoginResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - access_token
          - refresh_token
          - user
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 1800
            user:
              $ref: '#/components/schemas/UserSummary'
    RefreshTokenResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - access_token
          properties:
            access_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 1800
    Department:
      type: object
      required:
      - department_id
      - code
      - name
      properties:
        department_id:
          type: string
          format: uuid
        code:
          type: string
          example: NEU
        name:
          type: string
          example: 신경과
    Clinician:
      type: object
      required:
      - clinician_id
      - user_id
      - name
      - department
      properties:
        clinician_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          example: 이의사
        license_number:
          type: string
          example: MD-000001
        department:
          $ref: '#/components/schemas/Department'
        hospital_name:
          type: string
          example: BrainOn 대학병원
    Patient:
      type: object
      required:
      - patient_id
      - user_id
      - name
      - medical_record_number
      properties:
        patient_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        medical_record_number:
          type: string
          example: MRN-2026-00001
        name:
          type: string
          example: 김환자
        birth_date:
          type: string
          format: date
          example: '1964-05-12'
        sex:
          type: string
          enum:
          - M
          - F
          - UNKNOWN
        phone:
          type: string
          example: 010-1234-5678
        emergency_contact:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - MERGED
          example: ACTIVE
        created_at:
          type: string
          format: date-time
    PatientCreateRequest:
      type: object
      required:
      - name
      - birth_date
      - sex
      properties:
        name:
          type: string
        birth_date:
          type: string
          format: date
        sex:
          type: string
          enum:
          - M
          - F
          - UNKNOWN
        phone:
          type: string
        emergency_contact:
          type: string
        address:
          type: string
    PatientUpdateRequest:
      type: object
      properties:
        phone:
          type: string
        emergency_contact:
          type: string
        address:
          type: string
    PatientHomeSummary:
      type: object
      required:
      - patient
      - medications_today
      - unread_notification_count
      properties:
        patient:
          $ref: '#/components/schemas/Patient'
        next_appointment:
          allOf:
          - $ref: '#/components/schemas/Appointment'
          nullable: true
        medications_today:
          type: object
          required:
          - total
          - taken
          - remaining
          properties:
            total:
              type: integer
            taken:
              type: integer
            remaining:
              type: integer
        latest_result:
          allOf:
          - $ref: '#/components/schemas/TestResult'
          nullable: true
        unread_notification_count:
          type: integer
    Appointment:
      type: object
      required:
      - appointment_id
      - patient_id
      - clinician
      - department
      - scheduled_at
      - status
      properties:
        appointment_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        clinician:
          $ref: '#/components/schemas/Clinician'
        department:
          $ref: '#/components/schemas/Department'
        scheduled_at:
          type: string
          format: date-time
          example: '2026-08-05T10:30:00+09:00'
        reason:
          type: string
          example: CT 검사 결과 상담
        status:
          type: string
          enum:
          - SCHEDULED
          - COMPLETED
          - CANCELLED
          - NO_SHOW
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AppointmentCreateRequest:
      type: object
      required:
      - patient_id
      - clinician_id
      - department_id
      - scheduled_at
      properties:
        patient_id:
          type: string
          format: uuid
        clinician_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        scheduled_at:
          type: string
          format: date-time
        reason:
          type: string
    AppointmentUpdateRequest:
      type: object
      properties:
        clinician_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        scheduled_at:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum:
          - SCHEDULED
          - COMPLETED
          - NO_SHOW
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          example: 환자 요청
    ClinicalRecord:
      type: object
      required:
      - clinical_record_id
      - patient_id
      - clinician_id
      - recorded_at
      - assessment
      properties:
        clinical_record_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        clinician_id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
          nullable: true
        recorded_at:
          type: string
          format: date-time
        chief_complaint:
          type: string
          nullable: true
        subjective:
          type: string
          nullable: true
        objective:
          type: string
          nullable: true
        assessment:
          type: string
        plan:
          type: string
          nullable: true
        patient_visible_summary:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClinicalRecordCreateRequest:
      type: object
      required:
      - patient_id
      - assessment
      properties:
        patient_id:
          type: string
          format: uuid
        appointment_id:
          type: string
          format: uuid
        chief_complaint:
          type: string
        subjective:
          type: string
        objective:
          type: string
        assessment:
          type: string
        plan:
          type: string
        patient_visible_summary:
          type: string
    PrescriptionItem:
      type: object
      required:
      - prescription_item_id
      - medicine_name
      - dosage
      - frequency
      - start_date
      properties:
        prescription_item_id:
          type: string
          format: uuid
        medicine_name:
          type: string
          example: Aspirin
        dosage:
          type: number
          example: 100
        dose_unit:
          type: string
          example: mg
        frequency:
          type: string
          example: 하루 1회
        route:
          type: string
          example: oral
        instructions:
          type: string
          example: 아침 식후 복용
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
    PrescriptionItemCreate:
      type: object
      required:
      - medicine_name
      - dosage
      - dose_unit
      - frequency
      - start_date
      properties:
        medicine_name:
          type: string
        dosage:
          type: number
        dose_unit:
          type: string
        frequency:
          type: string
        route:
          type: string
        instructions:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    Prescription:
      type: object
      required:
      - prescription_id
      - patient_id
      - clinician_id
      - status
      - items
      - created_at
      properties:
        prescription_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        clinician_id:
          type: string
          format: uuid
        clinical_record_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - ACTIVE
          - DISCONTINUED
          - COMPLETED
        notes:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/PrescriptionItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PrescriptionCreateRequest:
      type: object
      required:
      - patient_id
      - items
      properties:
        patient_id:
          type: string
          format: uuid
        clinical_record_id:
          type: string
          format: uuid
        notes:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PrescriptionItemCreate'
    MedicationSchedule:
      type: object
      required:
      - schedule_id
      - prescription_item_id
      - scheduled_at
      - status
      properties:
        schedule_id:
          type: string
          format: uuid
        prescription_item_id:
          type: string
          format: uuid
        medicine_name:
          type: string
        scheduled_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - SCHEDULED
          - TAKEN
          - MISSED
          - SKIPPED
    MedicationRecord:
      type: object
      required:
      - medication_record_id
      - prescription_item_id
      - scheduled_at
      - status
      properties:
        medication_record_id:
          type: string
          format: uuid
        prescription_item_id:
          type: string
          format: uuid
        scheduled_at:
          type: string
          format: date-time
        taken_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - SCHEDULED
          - TAKEN
          - MISSED
          - SKIPPED
        note:
          type: string
          nullable: true
    MedicationRecordCreateRequest:
      type: object
      required:
      - prescription_item_id
      - scheduled_at
      - status
      properties:
        prescription_item_id:
          type: string
          format: uuid
        scheduled_at:
          type: string
          format: date-time
        taken_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - TAKEN
          - MISSED
          - SKIPPED
        note:
          type: string
    TestResult:
      type: object
      required:
      - test_result_id
      - patient_id
      - test_type
      - status
      - is_released_to_patient
      properties:
        test_result_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
          nullable: true
        test_type:
          type: string
          enum:
          - BRAIN_CT
          - MRI
          - LAB
          - OTHER
        title:
          type: string
          example: 뇌 CT 검사 결과
        performed_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - DRAFT
          - FINAL
        summary:
          type: string
          nullable: true
        clinician_comment:
          type: string
          nullable: true
        result_file_uri:
          type: string
          nullable: true
        is_released_to_patient:
          type: boolean
        released_at:
          type: string
          format: date-time
          nullable: true
        released_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    TestResultCreateRequest:
      type: object
      required:
      - patient_id
      - test_type
      - title
      properties:
        patient_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        test_type:
          type: string
          enum:
          - BRAIN_CT
          - MRI
          - LAB
          - OTHER
        title:
          type: string
        performed_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - DRAFT
          - FINAL
          default: DRAFT
        summary:
          type: string
        clinician_comment:
          type: string
        result_file_uri:
          type: string
    Consultation:
      type: object
      required:
      - consultation_id
      - patient_id
      - requester_clinician_id
      - consultant_clinician_id
      - status
      properties:
        consultation_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
          nullable: true
        requester_clinician_id:
          type: string
          format: uuid
        consultant_clinician_id:
          type: string
          format: uuid
        question:
          type: string
        response:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - REQUESTED
          - IN_REVIEW
          - COMPLETED
          - CANCELLED
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    ConsultationCreateRequest:
      type: object
      required:
      - patient_id
      - consultant_clinician_id
      - question
      properties:
        patient_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        consultant_clinician_id:
          type: string
          format: uuid
        question:
          type: string
    Case:
      type: object
      required:
      - case_id
      - patient_id
      - study_type
      - status
      - created_at
      properties:
        case_id:
          type: string
          format: uuid
        patient_id:
          type: string
          format: uuid
        study_type:
          type: string
          enum:
          - BRAIN_CT
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - CREATED
          - UPLOADING
          - UPLOADED
          - INFERENCE_QUEUED
          - INFERENCE_RUNNING
          - COMPLETED
          - FAILED
        input_uri:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CaseCreateRequest:
      type: object
      required:
      - patient_id
      - study_type
      properties:
        patient_id:
          type: string
          format: uuid
        study_type:
          type: string
          enum:
          - BRAIN_CT
        description:
          type: string
    UploadUrlRequest:
      type: object
      required:
      - file_name
      - content_type
      - size_bytes
      properties:
        file_name:
          type: string
          example: ct.nii.gz
        content_type:
          type: string
          example: application/gzip
        size_bytes:
          type: integer
          minimum: 1
    UploadUrl:
      type: object
      required:
      - case_id
      - upload_url
      - object_path
      - expires_in
      properties:
        case_id:
          type: string
          format: uuid
        upload_url:
          type: string
          format: uri
        object_path:
          type: string
          example: cases/case-uuid/input/ct.nii.gz
        expires_in:
          type: integer
          example: 900
        required_headers:
          type: object
          additionalProperties:
            type: string
    UploadCompleteRequest:
      type: object
      required:
      - object_path
      - size_bytes
      - sha256
      properties:
        object_path:
          type: string
        size_bytes:
          type: integer
        sha256:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
    InferenceStartRequest:
      type: object
      properties:
        threshold:
          type: number
          minimum: 0
          maximum: 1
          default: 0.25
        min_component_size:
          type: integer
          minimum: 0
          default: 30
        sliding_window_step_size:
          type: number
          maximum: 1
          default: 0.5
          minimum: 0
          exclusiveMinimum: true
    InferenceJob:
      type: object
      required:
      - job_id
      - case_id
      - status
      - progress
      properties:
        job_id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
          - CANCELLED
        progress:
          type: integer
          minimum: 0
          maximum: 100
        error:
          allOf:
          - $ref: '#/components/schemas/InferenceError'
          nullable: true
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
    InferenceError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    ModelInfo:
      type: object
      required:
      - model_id
      - model_version
      properties:
        model_id:
          type: string
          example: bhsd-nnunet-stage-attention
        model_version:
          type: string
          example: 1.0.0
        checkpoint:
          type: string
          example: checkpoint_best.pth
        threshold:
          type: number
          example: 0.25
    Prediction:
      type: object
      required:
      - mask_uri
      - lesion_voxels
      - lesion_volume_ml
      - shape
      - spacing
      properties:
        mask_uri:
          type: string
        preview_uri:
          type: string
          nullable: true
        lesion_voxels:
          type: integer
        lesion_volume_ml:
          type: number
          format: float
        lesion_slice_count:
          type: integer
        lesion_slice_start:
          type: integer
          nullable: true
        lesion_slice_end:
          type: integer
          nullable: true
        max_lesion_slice:
          type: integer
          nullable: true
        shape:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: integer
        spacing:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
    Timing:
      type: object
      properties:
        preprocessing_seconds:
          type: number
        inference_seconds:
          type: number
        postprocessing_seconds:
          type: number
        total_seconds:
          type: number
    InferenceResult:
      type: object
      required:
      - case_id
      - job_id
      - status
      - model
      - prediction
      - timing
      properties:
        case_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - COMPLETED
        model:
          $ref: '#/components/schemas/ModelInfo'
        prediction:
          $ref: '#/components/schemas/Prediction'
        timing:
          $ref: '#/components/schemas/Timing'
    ViewerInfo:
      type: object
      required:
      - case_id
      - source_uri
      properties:
        case_id:
          type: string
          format: uuid
        source_uri:
          type: string
        mask_uri:
          type: string
          nullable: true
        preview_uri:
          type: string
          nullable: true
        download_expires_in:
          type: integer
          example: 900
    DeviceCreateRequest:
      type: object
      required:
      - platform
      - fcm_token
      properties:
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
          - WEB
        fcm_token:
          type: string
        device_name:
          type: string
          example: Galaxy S25
    Device:
      type: object
      required:
      - device_id
      - platform
      - device_name
      - registered_at
      properties:
        device_id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
          - WEB
        device_name:
          type: string
        registered_at:
          type: string
          format: date-time
    Notification:
      type: object
      required:
      - notification_id
      - type
      - title
      - body
      - is_read
      - created_at
      properties:
        notification_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - APPOINTMENT_REMINDER
          - APPOINTMENT_CHANGED
          - MEDICATION_REMINDER
          - PRESCRIPTION_CREATED
          - TEST_RESULT_READY
          - SYSTEM_NOTICE
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties: true
        is_read:
          type: boolean
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    NotificationCreateRequest:
      type: object
      required:
      - patient_id
      - type
      - title
      - body
      properties:
        patient_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - APPOINTMENT_CHANGED
          - PRESCRIPTION_CREATED
          - TEST_RESULT_READY
          - SYSTEM_NOTICE
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties: true
        send_push:
          type: boolean
          default: true
    ClinicianDashboard:
      type: object
      required:
      - today_appointments
      - waiting_patients
      - running_inferences
      - completed_results
      - failed_inferences
      properties:
        today_appointments:
          type: integer
        waiting_patients:
          type: integer
        running_inferences:
          type: integer
        completed_results:
          type: integer
        failed_inferences:
          type: integer
