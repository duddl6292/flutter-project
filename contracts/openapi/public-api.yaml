openapi: 3.0.3
info:
  title: BrainOn Public API
  version: 1.0.0
  description: Flutter 환자 앱과 React 의료진 웹이 Django REST API를 통해 사용하는 공개 계약입니다.
servers:
- url: http://localhost:8000
  description: Local
- url: https://api.example.com
  description: Production placeholder
tags:
- name: System
- name: Auth
- name: Clinicians
- name: Patients
- name: Appointments
- name: Clinical Records
- name: Prescriptions
- name: Medications
- name: Test Results
- name: Consultations
- name: CT Cases
- name: Inference Jobs
- name: Notifications
security:
- BearerAuth: []
paths:
  /api/v1/health:
    get:
      tags:
      - System
      summary: Django API 상태 확인
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      service:
                        type: string
                        example: brainon-backend
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 로그인
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /api/v1/auth/token/refresh:
    post:
      tags:
      - Auth
      summary: Access Token 갱신
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃 및 Refresh Token 폐기
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
  /api/v1/auth/password/reset:
    post:
      tags:
      - Auth
      summary: 비밀번호 재설정 요청
      responses:
        '202':
          description: 요청 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      security: []
  /api/v1/users/me:
    get:
      tags:
      - Auth
      summary: 현재 로그인 사용자 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/departments:
    get:
      tags:
      - Clinicians
      summary: 진료과 목록 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/clinicians:
    get:
      tags:
      - Clinicians
      summary: 의료진 목록 및 검색
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Clinician'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: department_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
  /api/v1/clinicians/{clinician_id}:
    get:
      tags:
      - Clinicians
      summary: 의료진 상세 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Clinician'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: clinician_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/v1/clinicians/me/dashboard:
    get:
      tags:
      - Clinicians
      summary: 의료진 대시보드 요약
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ClinicianDashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - CLINICIAN
      - ADMIN
  /api/v1/patients:
    get:
      tags:
      - Patients
      summary: 환자 목록 및 검색
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Patient'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
      x-roles:
      - CLINICIAN
      - ADMIN
    post:
      tags:
      - Patients
      summary: 환자 등록
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCreateRequest'
      x-roles:
      - CLINICIAN
      - ADMIN
  /api/v1/patients/me:
    get:
      tags:
      - Patients
      summary: 내 환자 정보 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - PATIENT
    patch:
      tags:
      - Patients
      summary: 내 환자 연락처 수정
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdateRequest'
      x-roles:
      - PATIENT
  /api/v1/patients/me/home:
    get:
      tags:
      - Patients
      summary: 환자 앱 홈 요약
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PatientHomeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - PATIENT
  /api/v1/patients/{patient_id}:
    get:
      tags:
      - Patients
      summary: 환자 상세 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - CLINICIAN
      - ADMIN
    patch:
      tags:
      - Patients
      summary: 환자 정보 수정
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Patient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientUpdateRequest'
      x-roles:
      - CLINICIAN
      - ADMIN
  /api/v1/patients/{patient_id}/summary:
    get:
      tags:
      - Patients
      summary: 환자 진료 요약 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    properties:
                      patient:
                        $ref: '#/components/schemas/Patient'
                      upcoming_appointments:
                        type: array
                        items:
                          $ref: '#/components/schemas/Appointment'
                      active_prescriptions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Prescription'
                      latest_test_results:
                        type: array
                        items:
                          $ref: '#/components/schemas/TestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: patient_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      x-roles:
      - CLINICIAN
      - ADMIN
  /api/v1/appointments:
    get:
      tags:
      - Appointments
      summary: 예약 목록 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Appointment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: patient
        in: query
        required: false
        schema:
          type: string
        description: '''me'' 또는 patient_id'
      - name: clinician_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: date_from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
    post:
      tags:
      - Appointments
      summary: 예약 생성
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreateRequest'
      x-roles:
      - CLINICIAN
      - ADMIN
  /api/v1/appointments/{appointment_id}:
    get:
      tags:
      - Appointments
      summary: 예약 상세 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
      - Appointments
      summary: 예약 변경
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentUpdateRequest'
      x-roles:
      - CLINICIAN
      - ADMIN
  /api/v1/appointments/{appointment_id}/cancel:
    post:
      tags:
      - Appointments
      summary: 예약 취소
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: appointment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
  /api/v1/clinical-records:
    get:
      tags:
      - Clinical Records
      summary: 진료기록 목록 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClinicalRecord'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
